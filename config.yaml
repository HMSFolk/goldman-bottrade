# ╔══════════════════════════════════════════════════════════════════╗
# ║  🔴 CONFIG LIVE — ทุนจริง $100 (สร้าง 2026-07-11 จาก config_main)   ║
# ║                                                                    ║
# ║  GO-LIVE CHECKLIST (ครบทุกข้อก่อนใช้ไฟล์นี้):                        ║
# ║   [ ] เห็น log "✅ CB pnl source: MT5 deals" หลัง deploy risk fix   ║
# ║   [ ] analyze_shadow รอบจันทร์ปิดเคส GBP SELL คลัสเตอร์แล้ว          ║
# ║   [ ] เทส CB: จำกัด loss_usd ชั่วคราว=1 บน demo 1 วัน → เห็น trigger ║
# ║                                                                    ║
# ║  กฎถอย (ตกลงไว้ล่วงหน้า — ห้ามต่อรองตอนพอร์ตแดง):                    ║
# ║   • balance < $90 (−10%)          → กลับ demo + วิเคราะห์            ║
# ║   • 15 ไม้แรก E < 0               → กลับ demo + วิเคราะห์            ║
# ║   • weekly CB trigger (10%)       → กลับ demo อัตโนมัติโดยนิยาม      ║
# ║  ความคาดหวังที่ตรงจริง: E≈+0.14R × R≈$1.2 × 1-3 ไม้/วัน             ║
# ║   ≈ $0.2-0.5/วัน — live $100 คือ "สอบจริงของระบบ" ไม่ใช่รายได้       ║
# ╚══════════════════════════════════════════════════════════════════╝
# โครงสร้าง 8 หมวด:
#   1. CONNECTION   broker, mt5
#   2. UNIVERSE     symbols, symbol_map, data
#   3. RISK         risk, circuit_breaker, daily_tracking
#   4. SIGNAL       signal, order, regime_*, strategy_filters
#   5. FILTERS      session, session_filter, news_filter, spread_filter
#   6. EXECUTION    trade_management, symbol_settings
#   7. TRAINING     training
#   8. SYSTEM       paths, logging, dashboard, notifications, api_keys
# ══════════════════════════════════════════════════════════════════════
# 1. CONNECTION
# ══════════════════════════════════════════════════════════════════════
# broker ที่ใช้อยู่ — เปลี่ยน broker แก้แค่ตรงนี้ (ต้องมี mapping ใน symbol_map)
broker:
  name: "exness"

# การเชื่อมต่อ/reconnect กับ MetaTrader5
mt5:
  timeout_sec: 30
  max_reconnect_attempts: 5
  reconnect_delay_sec: 10
  reconnect:
    enabled              : true
    max_retries          : 10
    base_sleep_sec       : 5     # รอกี่วินาทีก่อนลองใหม่ครั้งแรก
    max_sleep_sec        : 300   # รอนานสุดกี่วินาทีระหว่างลองใหม่
    health_check_interval: 60
    alert_after_retries  : 3     # ลองครบกี่ครั้งแล้วค่อยแจ้งเตือน
    notify_telegram      : true

# ══════════════════════════════════════════════════════════════════════
# 2. UNIVERSE — symbol ที่เทรด + การแปลงชื่อ broker + ข้อมูลที่ดึง
# ══════════════════════════════════════════════════════════════════════
# คู่เงินที่เทรด — ใช้ชื่อกลาง (ไม่มี m) ทุกที่ ชื่อจริง broker แปลงผ่าน symbol_map
symbols:
  active:
    - "XAUUSD"
    - "EURUSD"
    - "GBPUSD"
  primary_timeframe: "M15"   # timeframe หลักที่ใช้ตัดสินใจเทรด
  htf_timeframes:            # timeframe สูงกว่า ใช้เช็คเทรนด์ใหญ่ (HTF filter)
    - "H1"
    - "H4"

# ชื่อ "กลาง" (ซ้าย) → ชื่อจริงของแต่ละ broker (ขวา)
# ย้าย broker: 1) เปลี่ยน broker.name  2) เพิ่มแถวที่นี่ถ้ายังไม่มี
symbol_map:
  XAUUSD:
    exness     : "XAUUSDm"
  EURUSD:
    exness     : "EURUSDm"
  GBPUSD:
    exness     : "GBPUSDm"
# จำนวนแท่งราคาที่ดึงเก็บ + symbol ฝั่ง macro ที่ใช้เป็น feature เสริม
data:
  history_bars:
    M15: 50000
    H1:  12000
    H4:  4000
  # ✅ (2026-07-01) กฎเหล็ก: collect_macro.py อ่าน key นี้ (เดิมไม่มีใน config
  #   โค้ดใช้ default 730 เงียบๆ) — ดึง macro ย้อนหลังกี่วัน
  macro_history_days: 730
  macro_symbols:
    DXY:    "DX-Y.NYB"
    US10Y:  "^TNX"
    VIX:    "^VIX"
    SILVER: "SI=F"
    OIL:    "CL=F"

# ══════════════════════════════════════════════════════════════════════
# 3. RISK — คุมความเสี่ยงต่อไม้/ต่อวัน + หยุดอัตโนมัติ
# ══════════════════════════════════════════════════════════════════════
# กฎคุมความเสี่ยงต่อไม้ (limit ขาดทุนรายวันอยู่ที่ circuit_breaker)
risk:
  risk_per_trade           : 0.01 
  max_open_trades          : 2      # LIVE $100: 2 ไม้รวม (EUR 1 + GBP 1, ทองปิด)
  min_lot                  : 0.01
  max_lot                  : 0.10   # LIVE: ลดเพดาน lot — บน $100 ไม่มีเหตุให้เกิน 0.10
  max_positions_per_symbol : 1      # LIVE $100: 1 ไม้/สกุล (เดิม demo 2)
                                     #   เหตุผล: ไม้ที่ 2 ไม่เพิ่ม E ต่อ decision แค่เพิ่ม
                                     #   ขนาด (พฤ 9 ก.ค. การเบิ้ลไม้ขยายวันแพ้เป็น 2 เท่า)
                                     #   + สถิติ per-decision สะอาดขึ้นสำหรับรอบวิเคราะห์
  add_same_direction_only  : true   # เพิ่ม position ที่ 2 ได้เฉพาะทิศเดิม (ห้ามสวน)
  add_position_min_conf    : 0.50   # confidence ขั้นต่ำก่อนเพิ่ม position ที่ 2
  add_position_min_agree   : 2      # ต้อง >= 2/3 โมเดลเห็นตรงกันก่อนเพิ่ม
  add_only_in_profit       : true   # เติมไม้ที่ 2+ ได้เฉพาะตอนไม้เดิมลอยกำไร

# หยุดเทรดอัตโนมัติเมื่อขาดทุนเกิน threshold — จุดเดียวของระบบสำหรับ daily-loss
circuit_breaker:
  enabled        : true
  notify_telegram: true
  daily:
    enabled    : true
    loss_pct   : 10.0      # LIVE $100: $5/วัน ≈ แพ้ 3-4 ไม้ FX → พอให้เทรดทั้งวัน
                          #   แต่ตัดวัน chop แบบ พฤ 9 ก.ค. (-$7.2) ก่อนบานปลาย
    loss_usd   : null
    auto_resume: true     # resume เองวันถัดไป 00:05 UTC
  weekly:
    enabled : true
    loss_pct: 10.0        # LIVE: 10% = จุด "กฎถอย" ตามแผนเกต live พอดี
                          #   weekly เป็น MANUAL RESUME → trigger เมื่อไหร่
                          #   = สัญญาณบังคับกลับ demo + ทบทวน ไม่ใช่แค่พัก
  consecutive_losses:
    enabled       : true
    count         : 1     # LIVE: แพ้ติด 4 ไม้ (≈ -$5) → พัก 4 ชม.
                          #   (WR 44% แพ้ติด 4 มีโอกาส ~10%/สัปดาห์ = เจอได้
                          #   แต่ควรพักจริง ไม่ใช่ 1 ชม. ที่ = ข้าม 4 tick)
    cooldown_hours: 1
  floating_dd:
    enabled : true
    max_pct : 10.0        # LIVE: 2 ไม้ (~2.8% exposure) ไม่มีทางลอยถึง 10%
                          #   ถ้าถึง = มีอะไรผิดปกติร้ายแรง สมควรหยุด (manual resume)
    warn_pct: 70          # เตือนที่ 70% ของ limit (= floating 7%)

# เวลา reset ตัวนับ session-loss (symbol_settings.*.max_session_losses)
daily_tracking:
  reset_hours_utc: [6, 13, 21]   # Reset ตอน Asia / London / NY เปิด

# ══════════════════════════════════════════════════════════════════════
# 4. SIGNAL — โมเดลตัดสินใจ + SL/TP + regime
# ══════════════════════════════════════════════════════════════════════
# threshold การตัดสินใจของโมเดล
signal:
  active_model                      : "ensemble"   # rule_based | xgb | lgbm | lstm | ensemble
  min_confidence                    : 0.42   # ขั้นต่ำที่จะเปิดไม้ (override ที่ symbol_settings)
  regime_conf_thresholds:
    trending_up  : 0.55
    trending_down: 0.55
    ranging      : 0.60
    volatile     : 0.70
    uncertain    : 0.65
  cooldown_min                      : 10     # พักกี่นาทีหลังเทรดก่อนเทรดรอบใหม่
  min_directional_prob              : 0.20   # sell_prob ขั้นต่ำ (มักอยู่ 0.15-0.25 ตอน trending)
  min_agree_for_directional_override: 2      # ต้อง >= 2/3 โมเดลเห็นตรงกันจึง override ทิศได้
# ระยะ SL/TP และพฤติกรรมตอนส่ง order tp_ratio=1.8: TP=SL×1.8 → จุดคุ้มทุน WR=35.7% (ที่ WR40% = +0.12R กำไร)
#   เดิม 0.7 ต้องการ WR 58.8% แต่ระบบทำได้ ~52% → ขาดทุน (ต้นตอเดิม)
order:
  sl_points:                 # ⚠️ ยังไม่ยืนยันว่า key นี้ถูกใช้จริง (กฎเหล็ก config!)
                             #   หลักฐานแย้ง: SL จริงใน log = ATR% (EUR 114pt ≠ 80 เดิม,
                             #   XAU 6770pt ≠ 100) → SL น่าจะมาจาก strategy ไม่ใช่ตรงนี้
                             #   ห้ามพึ่งค่านี้จนกว่าไล่โค้ดเจอผู้อ่าน
    XAUUSD: 200
    EURUSD:  100
    GBPUSD:  100
    default:  90
  tp_ratio: 1.6              # TP = SL × ค่านี้ (ต้อง > 1.0 ให้ไม้ชนะใหญ่กว่าไม้แพ้)
  min_rr  : 1.5             # R:R ขั้นต่ำที่ยอมรับ — ตั้งให้ ≤ tp_ratio เสมอ
  max_slippage         : 10      # slippage ที่ยอมรับได้ (points)
  magic_number          : 20250101   # เลขระบุ order ของบอท (กันชนกับ EA อื่น)
  order_comment        : "aurum_bot_v1"

# ตรวจจับสภาพตลาด (เทรนด์/sideway/ผันผวน)
# hysteresis_confirm=3: ต้องเห็น regime ใหม่ติดกัน 3 ครั้งก่อนเปลี่ยน (กันกระพริบ)
regime_detection:
  adx_period       : 14
  adx_trend_thresh : 25     # ADX สูงกว่านี้ = เทรนด์
  adx_range_thresh : 20     # ADX ต่ำกว่านี้ = sideway
  hurst_trend      : 0.55
  hurst_range      : 0.45
  atr_lookback     : 100
  vol_high_mult    : 1.5
  ema_fast         : 20
  ema_slow         : 50
  ema_trend        : 200
  cache_ttl_minutes: 15
  hysteresis_confirm: 3

# น้ำหนักของแต่ละโมเดลใน ensemble ตาม regime
regime_weights:
  trending_up  : {lgbm: 0.40, xgb: 0.35, lstm: 0.15, rule: 0.10}
  trending_down: {lgbm: 0.40, xgb: 0.35, lstm: 0.15, rule: 0.10}
  ranging      : {lgbm: 0.15, xgb: 0.15, lstm: 0.10, rule: 0.60}
  volatile     : {lgbm: 0.33, xgb: 0.33, lstm: 0.34, rule: 0.00}
  uncertain    : {lgbm: 0.30, xgb: 0.25, lstm: 0.20, rule: 0.25}

# เปิด/ปิด filter แต่ละตัวก่อนยืนยันสัญญาณ
strategy_filters:
  use_squeeze_filter   : false
  use_htf_filter       : false
  use_atr_low_filter   : false
  use_regime_filter    : true    # บล็อกเทรดสวนเทรนด์ใหญ่
  use_final_conf_check : false

# กฎละเอียดของ use_regime_filter
regime_filter:
  sell_override_enabled : true   # force SELL เมื่อโมเดล bias HOLD แต่เทรนด์ลงชัด (false ปิด)
  sell_override_min_adx : 28     # ต้อง ADX ≥ นี้ + trending_down
  sell_override_min_prob: 0.45   # ต้อง sell_prob ≥ นี้ (เข้มกว่า 0.35 กันสัญญาณอ่อน)
  blocked_combos:
    - {regime: trending_down, signal: BUY}
    - {regime: trending_up,   signal: SELL}

# ══════════════════════════════════════════════════════════════════════
# 5. FILTERS — ด่านเช็คก่อนเทรด (เวลา/ข่าว/spread)
# ══════════════════════════════════════════════════════════════════════
# ด่านเวลาแบบง่าย (ด่านสำรอง รองจาก session_filter) — เปิดกว้างทั้งวัน
session:
  allowed_hours_utc:
    start: 0
    end: 24
  skip_weekends     : true

# ด่านเวลาหลัก (DST-aware) — เช็คก่อนสร้าง signal ทุกครั้ง
session_filter:
  enabled     : true
  skip_weekend: true
  use_dst     : true
  overlap_only: false
  allowed_sessions:        # session ทั้งหมดที่ระบบรู้จัก
    - London    # 07:00-16:00 UTC
    - New York  # 12:00-21:00 UTC (EDT) / 13:00-22:00 UTC (EST)
    - Tokyo     # 00:00-09:00 UTC
    - Sydney    # 21:00-06:00 UTC
  symbol_sessions:          # session ที่อนุญาตต่อ symbol
    XAUUSD: ["Sydney", "Tokyo", "London", "New York"]
    EURUSD: ["Sydney", "Tokyo", "London", "New York"]
    GBPUSD: ["Sydney", "Tokyo", "London", "New York"]
  friday_close_hour: 21    # ตลาดปิดวันศุกร์กี่โมง UTC
  monday_open_hour :  7    # ตลาดเปิดวันจันทร์กี่โมง UTC

# บล็อกเทรดช่วงข่าวสำคัญ (high impact)
news_filter:
  enabled         : true
  buffer_minutes  : 15      # LIVE: คงเข้ม 15 นาที (spread ถ่างช่วงข่าวกิน SL แคบๆ ของเราแรง)
  high_impact_only: true
  fail_open       : true    # ดึงข่าวไม่ได้ → ปล่อยเทรดต่อ
  cache_hours     : 1

# spread กว้างเกิน limit → ไม่ส่ง order — จุดเดียวของระบบ
spread_filter:
  enabled  : true
  fail_open: true   # เช็ค spread ไม่ได้ → ปล่อยเทรดต่อ
  warn_pct : 70     # spread ใกล้ limit กี่% ถึง log เตือน
  limits:
    XAUUSD : 0.80
    EURUSD : 0.00030
    GBPUSD : 0.00050
    default: 0.00100

# ══════════════════════════════════════════════════════════════════════
# 6. EXECUTION — จัดการ position หลังเปิดไม้ + override รายตัว
# ══════════════════════════════════════════════════════════════════════
# จัดการ position หลังเปิดไม้
#   หน่วย (เมื่อ wire แล้ว): be/partial_rr = R เท่าระยะ SL, trailing_* = % ของราคา
trade_management:
  enable_breakeven    : false
  enable_partial_close: false
  enable_trailing     : false
  enable_time_exit    : false

  be_after_rr         : 0.8     # กำไรถึง 0.8R → ขยับ SL เท่าทุน
  partial_close_rr    : 1.0     # กำไรถึง 1.0R → ปิดบางส่วน
  partial_close_pct   : 0.50    # ปิด 50% (ที่เหลือวิ่งต่อถึง TP 1.8R)
  trailing_start_pct  : 0.0030  # กำไร ≥ 0.30% ของราคา → เริ่ม trailing
  trailing_distance_pct: 0.0020 # trail SL ห่างราคา 0.20%
  max_hold_hours      : 8       # ถือเกิน 8 ชม. → ปิดตามเวลา (กันไม้ค้าง)

# Override ค่า global (risk/signal) เป็นรายตัว — ใช้ที่ main.py + risk_manager.py
#   XAU 0.04: บัญชีเล็ก + lot floor 0.01 → ทอง 1 ไม้เสี่ยงขั้นต่ำ ~2.5%
#   ตั้งต่ำกว่า ~0.025 ทองจะแทบไม่เทรดบนพอร์ตขนาดนี้
symbol_settings:
  XAUUSD:
    min_confidence     : 0.52  # ค่าปกติ (ผล demo: เกต 0.47 แยกไม้ดี/แย่ได้ —
                               #   ไม้ผ่าน +10.83, ไม้โดนตัด = แพ้จริงใน shadow)
    max_session_losses : 3
    risk_multiplier    : 0.50
    cooldown_after_loss: 60
    # 🔒 ทองปิดบน LIVE $100 โดยตั้งใจ: 0.01 lot (floor) เสี่ยงจริง $6.8-12.7/ไม้
    #   = 7-13% ของพอร์ต → max_risk_pct 0.02 บล็อกทุกไม้อัตโนมัติ
    # 🔓 เงื่อนไขปลด (เขียนล่วงหน้า กันใจร้อน): ทุน ≥ $600
    #   (ไม้ทองแย่สุดที่เคยเห็น $12.7 จะ = ~2.1%) → ค่อยขยับเป็น 0.025
    max_risk_pct       : 0.02
  EURUSD:
    min_confidence     : 0.42
    risk_multiplier    : 1.00
    max_session_losses : 3
    cooldown_after_loss: 10
    max_risk_pct       : 0.02   # ✅ 1a: 0.015→0.02 บัญชี $100 FX 0.01 lot เสี่ยง ~2% (floor) รับได้
  GBPUSD:
    min_confidence     : 0.42
    risk_multiplier    : 1.00
    max_session_losses : 3
    cooldown_after_loss: 10
    max_risk_pct       : 0.02   # ✅ 1a: 0.015→0.02 เช่นเดียวกับ EUR
  _default:                    # symbol ที่ไม่ได้ระบุด้านบน
    min_confidence     : 0.42
    risk_multiplier    : 1.00
    max_session_losses : 3
    cooldown_after_loss: 10
    max_risk_pct       : 0.015

# ══════════════════════════════════════════════════════════════════════
# 7. TRAINING — พารามิเตอร์ตอน train โมเดล (scripts/retrain_all.py)
# ══════════════════════════════════════════════════════════════════════
training:
  label_method  : "triple_barrier"
  forward_bars  : 6       # มองไปข้างหน้า 6 แท่ง (90 นาที) ให้ราคาแตะ barrier
  #   เดิม hardcode ในโค้ด: บน 2.0 / ล่าง 1.5 (ไม่สมมาตร) → ราคาแตะฝั่งล่าง
  #   ค่านี้: สูงขึ้น = สัญญาณน้อยแต่ชัด (HOLD เยอะ) | ต่ำลง = สัญญาณถี่แต่ noise เพิ่ม
  tb_atr_mult   : 1.2
  min_return_pct: 0.0007  # ใช้กับ label_method simple/risk_adjusted (fallback ของ triple_barrier)
  wf_gap_bars   : 96      # เว้นกี่แท่งระหว่าง train/test กัน look-ahead
  xgb_params:
    n_estimators    : 500
    learning_rate   : 0.03
    max_depth       : 6
    min_child_weight: 10
    subsample       : 0.8
    colsample_bytree: 0.8
  lgbm_params:
    num_leaves      : 63
    learning_rate   : 0.03
    min_data_in_leaf: 50
    feature_fraction: 0.8
    num_boost_round : 1000

# ══════════════════════════════════════════════════════════════════════
# 8. SYSTEM — paths, logging, dashboard, แจ้งเตือน, API keys
# ══════════════════════════════════════════════════════════════════════
# โฟลเดอร์ที่บอทใช้อ่าน/เขียน
paths:
  data_raw      : "data/raw"
  data_processed: "data/processed"
  models_saved  : "models/saved"
  logs          : "logs"
  db            : "db/trades.db"
  reports       : "reports"
  flags         : "flags"

# toggle log เสริม (level/rotation คุมที่ logging.yaml แยก ไม่ใช่ที่นี่)
logging:
  shadow_trades : true    # true = บันทึกไม้ที่โดน gate ตัด → logs/shadow_trades.jsonl
                          # (เก็บไว้วัด edge/หาบั๊ก gate โดยไม่เสียเงินจริง)
# Streamlit dashboard
dashboard:
  port               : 8501
  refresh_sec        : 30

# แจ้งเตือนผ่าน Telegram ตอนไหนบ้าง
notifications:
  notify_on:
    order_open    : true
    order_close   : true
    order_failed  : true
    daily_summary : true
    daily_loss_hit: true
  daily_summary_hour: 21   # ส่งสรุปประจำวันกี่โมง UTC

# Finnhub free ไม่รองรับ economic calendar → fallback ForexFactory อัตโนมัติ (ไม่ใช่บั๊ก)
api_keys:
  finnhub: "d8mu069r01qp7ubnsekgd8mu069r01qp7ubnsel0"