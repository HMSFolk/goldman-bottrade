# ═══════════════════════════════════════════════════════════════
#  CONFIG LIVE — ทุนจริง $100
#  กฎถอย: balance < $90 | 15 ไม้แรก E<0 | weekly CB → กลับ demo
#  อัปเดต 2026-07-12
# ═══════════════════════════════════════════════════════════════

# ────────────── โบรกเกอร์ ──────────────
broker:
  name: "exness"                     # ชื่อโบรก → ใช้เลือกชื่อ symbol ใน symbol_map ด้านล่าง

# ────────────── การเชื่อมต่อ MT5 ──────────────
mt5:
  timeout_sec: 30                    # รอ MT5 ตอบกี่วิ ก่อนถือว่า timeout
  max_reconnect_attempts: 5          # (ค่าเก่า/สำรอง) จำนวนครั้งต่อใหม่แบบพื้นฐาน
  reconnect_delay_sec: 10            # (ค่าเก่า/สำรอง) หน่วงกี่วิระหว่างต่อใหม่
  reconnect:                         # ระบบต่อใหม่อัตโนมัติตัวหลัก
    enabled              : true      # เปิดใช้ auto-reconnect
    max_retries          : 10        # ลองใหม่สูงสุดกี่ครั้งก่อนยอมแพ้ | เพิ่ม = ทนเน็ตหลุดนานขึ้น
    base_sleep_sec       : 5         # หน่วงครั้งแรก 5 วิ แล้วเพิ่มขึ้นเรื่อยๆ (backoff)
    max_sleep_sec        : 300       # หน่วงสูงสุดไม่เกิน 5 นาที
    health_check_interval: 60        # เช็คสุขภาพ connection ทุก 60 วิ
    alert_after_retries  : 3         # ลองเกิน 3 ครั้งแล้วยังไม่ติด → ส่งแจ้งเตือน
    notify_telegram      : true      # แจ้งเตือนเรื่อง connection ผ่าน Telegram

# ────────────── สินทรัพย์ + timeframe ──────────────
symbols:
  active:                            # คู่ที่บอทเทรด — ลบออก = หยุดเทรดคู่นั้น
    - "XAUUSD"
    - "EURUSD"
    - "GBPUSD"
  primary_timeframe: "M15"           # TF หลักที่ใช้ตัดสินใจเข้าไม้
  htf_timeframes:                    # TF สูงกว่า ใช้ทำ features ประกอบ (เทรนด์ใหญ่)
    - "H1"
    - "H4"

# ────────────── แปลงชื่อ symbol กลาง → ชื่อจริงของโบรก ──────────────
symbol_map:                          # Exness ใช้ชื่อลงท้าย m — เปลี่ยนโบรกต้องแก้ตรงนี้
  XAUUSD:
    exness     : "XAUUSDm"
  EURUSD:
    exness     : "EURUSDm"
  GBPUSD:
    exness     : "GBPUSDm"

# ────────────── ข้อมูลย้อนหลัง ──────────────
data:
  history_bars:                      # ดึงแท่งเทียนย้อนหลังกี่แท่งต่อ TF (เทรน/คำนวณ features)
    M15: 50000                       # ~1.4 ปี | เพิ่ม = ข้อมูลเยอะขึ้นแต่ช้าลง
    H1:  12000
    H4:  4000
  macro_history_days: 730            # ดึงข้อมูล macro ย้อนหลัง 2 ปี
  macro_symbols:                     # ตัวชี้วัด macro ที่ใช้เป็น features (ticker ของ Yahoo)
    DXY:    "DX-Y.NYB"               # ดัชนีดอลลาร์
    US10Y:  "^TNX"                   # ผลตอบแทนพันธบัตร US 10 ปี
    VIX:    "^VIX"                   # ดัชนีความกลัว
    SILVER: "SI=F"                   # เงิน (สัมพันธ์กับทอง)
    OIL:    "CL=F"                   # น้ำมัน

# ────────────── ความเสี่ยงและจำนวนไม้ ──────────────
#  ⚠️ ทุน $100: lot ขั้นต่ำ 0.01 ทำให้ FX เสี่ยงจริง ~1.1-1.4%/ไม้เสมอ
#  ปุ่มคุมความเสี่ยงตัวจริง = max_risk_pct รายสกุล + จำนวนไม้ + circuit_breaker
risk:
  risk_per_trade           : 0.005   # เป้าเสี่ยง 0.5%/ไม้ — มีผลจริงเมื่อทุนโตพอ
  max_open_trades          : 5       # ถือพร้อมกันสูงสุด 5 ไม้ (1 ไม้ × 5 คู่)
  min_lot                  : 0.01    # lot ต่ำสุด (พื้นของโบรก ลดกว่านี้ไม่ได้)
  max_lot                  : 0.10    # lot สูงสุด กันคำนวณพลาดแล้วเปิดไม้ยักษ์
  max_positions_per_symbol : 2      # 1 ไม้ต่อคู่ — กันเบิ้ลไม้ทิศเดียวกัน
  add_same_direction_only  : true    # (กลุ่ม add_* ไม่ทำงานเมื่อจำกัด 1 ไม้/คู่)
  add_position_min_conf    : 0.51    #   └ ความมั่นใจขั้นต่ำถ้าจะเติมไม้
  add_position_min_agree   : 2       #   └ โมเดลเห็นตรงกันอย่างน้อยกี่ตัว
  add_only_in_profit       : true    #   └ เติมได้เฉพาะตอนไม้แรกกำไร

# ────────────── เบรกอัตโนมัติ (circuit breaker) ──────────────
#  ลดค่า % = หยุดไวขึ้น ปลอดภัยขึ้นแต่เสียโอกาส | เพิ่ม = กลับกัน
circuit_breaker:
  enabled        : true              # สวิตช์ใหญ่ของระบบเบรกทั้งหมด
  notify_telegram: true              # เบรกทำงานเมื่อไหร่ แจ้ง Telegram
  daily:                             # เบรกรายวัน
    enabled    : true
    loss_pct   : 12.0                # ขาดทุนรวมวันนี้เกิน 12% ($12) → พักถึง 00:05 UTC
    loss_usd   : null                # ใส่เลข USD = ใช้แทน % (ตั้ง 1 ไว้เทสระบบได้)
    auto_resume: true                # ข้ามวันแล้วกลับมาเทรดเอง ไม่ต้องสั่ง
  weekly:                            # เบรกรายสัปดาห์
    enabled : true
    loss_pct: 15.0                   # สะสม 7 วันเกิน 15% → หยุด ต้องสั่ง /resume เอง
  consecutive_losses:                # เบรกแพ้ติดกัน
    enabled       : true
    count         : 3                # แพ้ 1 ไม้ = พักทันที (จังหวะหายใจ กัน revenge trade)
    cooldown_hours: 1                # พัก 1 ชม. แล้วนับใหม่
  floating_dd:                       # เบรกขาดทุน "ลอย" (ไม้ที่ยังไม่ปิด)
    enabled : true
    max_pct : 10.0                   # ขาดทุนลอยเกิน 10% ของ balance → หยุด (manual)
    warn_pct: 70                     # เตือนล่วงหน้าเมื่อถึง 70% ของ limit (= ลอย -7%)

# ────────────── เวลารีเซ็ตตัวนับแพ้ ──────────────
daily_tracking:
  reset_hours_utc: [6, 13, 21]       # รีเซ็ตตัวนับแพ้รายเซสชันที่ 6/13/21 UTC (ตามรอบตลาด)

# ────────────── เกตสัญญาณชั้นแรก ──────────────
#  เพิ่มค่า threshold = เทรดน้อยลง คัดมากขึ้น | ลด = เข้าไม้บ่อยขึ้น
signal:
  active_model                      : "ensemble"  # ใช้โมเดลรวม (lgbm+xgb+lstm+rule)
  min_confidence                    : 0.42        # ความมั่นใจขั้นต่ำสุดพื้นฐาน (ก่อนแยก regime)
  regime_conf_thresholds:            # ขั้นต่ำแยกตามสภาพตลาด
    trending_up  : 0.52              # ตลาดขาขึ้นชัด
    trending_down: 0.52              # ตลาดขาลงชัด
    ranging      : 0.52              # ตลาดไซด์เวย์ (rule weight สูง — คุมแน่นหน่อย)
    volatile     : 0.70              # ตลาดผันผวนแรง — คัดโหดสุด
    uncertain    : 0.59              # ตลาดอ่านไม่ออก — โซนอันตรายที่เคยแพ้จริง (chop 9 ก.ค.)
  cooldown_min                      : 20          # หลังปิดไม้ รอ 20 นาทีค่อยเข้าใหม่ (กัน re-entry หลัง SL)
  min_directional_prob              : 0.20        # prob ทิศทางขั้นต่ำที่ยอมรับ
  min_agree_for_directional_override: 2           # โมเดลเห็นตรงกันกี่ตัวถึง override ทิศได้

# ────────────── ออเดอร์: SL/TP ──────────────
#  SL จริงคำนวณจาก ATR% ใน strategy (พื้น 0.1% ของราคา) — ค่าล่างนี้เป็น fallback
order:
  sl_points:                         # ⚠️ ใช้เฉพาะตอน ATR พังเท่านั้น (key รายสกุลไม่ถูกอ่าน)
    XAUUSD: 200
    EURUSD:  100
    GBPUSD:  100
    default:  90
  tp_ratio: 1.65                      # TP = 1.6 เท่าของ SL → คุ้มทุนที่ winrate 38.5%
  min_rr  : 1.5                      # RR ต่ำกว่า 1.5 ไม่เอา
  max_slippage         : 10          # ยอมให้ราคาไหลได้สูงสุด 10 points ตอนส่งคำสั่ง
  magic_number          : 20250101   # เลขประจำตัวไม้ของบอท — ใช้แยกไม้บอทออกจากไม้มือ
  order_comment        : "aurum_bot_v1"  # ข้อความติดไม้ ดูใน MT5 ได้

# ────────────── ตัวจำแนกสภาพตลาด (regime) ──────────────
#  ใช้ ADX + Hurst + ATR → ผลไปเลือก threshold และ weights ด้านบน/ล่าง
regime_detection:
  adx_period       : 14              # คาบคำนวณ ADX
  adx_trend_thresh : 25              # ADX > 25 = มีเทรนด์
  adx_range_thresh : 20              # ADX < 20 = ไซด์เวย์
  hurst_trend      : 0.55            # Hurst > 0.55 = พฤติกรรมเทรนด์
  hurst_range      : 0.45            # Hurst < 0.45 = พฤติกรรม mean-revert
  atr_lookback     : 100             # ย้อนดู ATR กี่แท่งเพื่อวัดความผันผวนปกติ
  vol_high_mult    : 1.5             # ATR เกิน 1.5 เท่าของปกติ = volatile
  ema_fast         : 20              # EMA เร็ว/ช้า/ยาว ใช้ดูทิศเทรนด์
  ema_slow         : 50
  ema_trend        : 200
  cache_ttl_minutes: 15              # จำผล regime ไว้ 15 นาที ไม่คำนวณซ้ำถี่ๆ
  hysteresis_confirm: 3              # ต้องเห็น regime ใหม่ 3 ครั้งติดถึงยอมเปลี่ยน (กันสวิงไปมา)

# ────────────── น้ำหนักโมเดลแยกตาม regime ──────────────
#  น้ำหนักรวมต้อง = 1.0 ต่อแถว | ตลาดเทรนด์เชื่อ ML มาก ไซด์เวย์เชื่อ rule มาก
regime_weights:
  trending_up  : {lgbm: 0.40, xgb: 0.35, lstm: 0.15, rule: 0.10}
  trending_down: {lgbm: 0.40, xgb: 0.35, lstm: 0.15, rule: 0.10}
  ranging      : {lgbm: 0.15, xgb: 0.15, lstm: 0.10, rule: 0.60}
  volatile     : {lgbm: 0.33, xgb: 0.33, lstm: 0.34, rule: 0.00}
  uncertain    : {lgbm: 0.30, xgb: 0.25, lstm: 0.20, rule: 0.25}

# ────────────── สวิตช์เปิด/ปิด filter รายตัว ──────────────
strategy_filters:
  use_squeeze_filter   : false       # กรองช่วง Bollinger บีบตัว — ปิดอยู่
  use_htf_filter       : false       # กรองตามเทรนด์ TF ใหญ่ — ปิดอยู่
  use_atr_low_filter   : false       # กรองช่วง ATR ต่ำผิดปกติ — ปิดอยู่
  use_regime_filter    : true        # ✅ ด่านห้ามสวนเทรนด์ (ตั้งค่าบล็อกถัดไป)
  use_final_conf_check : false       # เช็คความมั่นใจซ้ำรอบสุดท้าย — ปิดอยู่

# ────────────── ด่าน regime: ห้ามสวนเทรนด์ ──────────────
#  (shadow กำลังเก็บหลักฐานว่าด่านนี้ช่วยหรือขวาง — อย่าแก้จนกว่าข้อมูลครบ)
regime_filter:
  sell_override_enabled : true       # เปิดช่องยกเว้นให้ SELL สวนได้ ถ้าเงื่อนไขแน่นพอ
  sell_override_min_adx : 28         #   └ ADX ต้องเกิน 28
  sell_override_min_prob: 0.45       #   └ prob ฝั่ง SELL ต้องเกิน 0.45
  blocked_combos:                    # คู่ที่ห้ามเด็ดขาด
    - {regime: trending_down, signal: BUY}   # ขาลงห้าม BUY
    - {regime: trending_up,   signal: SELL}  # ขาขึ้นห้าม SELL (เว้นเข้าเงื่อนไข override)

# ────────────── หน้าต่างเวลาแบบหยาบ (สำรอง) ──────────────
session:
  allowed_hours_utc:                 # เปิดกว้าง 0-24 — ให้ session_filter ด้านล่างคุมจริง
    start: 0
    end: 24
  skip_weekends     : true           # เสาร์-อาทิตย์ไม่เทรด

# ────────────── ด่านเซสชันหลัก ──────────────
session_filter:
  enabled     : true                 # เปิดใช้ด่านเซสชัน
  skip_weekend: true                 # ข้ามวันหยุด
  use_dst     : true                 # ปรับตามเวลาออมแสงอัตโนมัติ
  overlap_only: false                # true = เทรดเฉพาะช่วงตลาดซ้อนกัน (เช่น London∩NY)
  allowed_sessions:                  # เซสชันที่อนุญาตทั้งระบบ
    - London
    - New York
    - Tokyo
    - Sydney
  symbol_sessions:                   # เซสชันที่อนุญาตรายคู่ — ตัดชื่อออก = คู่นั้นไม่เทรดช่วงนั้น
    XAUUSD: ["Sydney", "Tokyo", "London", "New York"]
    EURUSD: ["Sydney", "Tokyo", "London", "New York"]
    GBPUSD: ["Sydney", "Tokyo", "London", "New York"]
  friday_close_hour: 21              # ศุกร์หยุดเข้าไม้ใหม่หลัง 21 UTC (กัน gap ข้ามสัปดาห์)
  monday_open_hour :  7              # จันทร์เริ่มเทรดหลัง 7 UTC (รอ spread ต้นสัปดาห์แคบลง)

# ────────────── เว้นเทรดรอบข่าวแรง ──────────────
news_filter:
  enabled         : true             # เปิดใช้
  buffer_minutes  : 15               # งดเข้าไม้ ±15 นาทีรอบข่าว (กัน spread ถ่างกิน SL)
  high_impact_only: true             # สนใจเฉพาะข่าวแรง (แดง)
  fail_open       : true             # ดึงข่าวไม่ได้ = เทรดต่อ ไม่ freeze ทั้งบอท
  cache_hours     : 1                # จำปฏิทินข่าวไว้ 1 ชม.

# ────────────── บล็อกไม้ตอน spread ถ่าง ──────────────
spread_filter:
  enabled  : true                    # เปิดใช้
  fail_open: true                    # อ่าน spread ไม่ได้ = ปล่อยผ่าน
  warn_pct : 70                      # เตือนเมื่อ spread ถึง 70% ของ limit
  limits:                            # spread เกินค่านี้ = ไม่เข้าไม้ (หน่วยราคา)
    XAUUSD : 0.80                    # ทอง: เกิน $0.80 ไม่เอา
    EURUSD : 0.00030                 # 3 pips
    GBPUSD : 0.00050                 # 5 pips
    default: 0.00100

# ────────────── ⚠️ NOT WIRED — ยังไม่มีโค้ดอ่านบล็อกนี้ ──────────────
#  ตั้งค่าไว้ล่วงหน้าเฉยๆ ปรับอะไรตรงนี้ "ไม่มีผลใดๆ" จนกว่าจะเขียนโค้ดรองรับ
trade_management:
  enable_breakeven    : false        # เลื่อน SL ไปจุดคุ้มทุนเมื่อกำไรถึงเป้า
  enable_partial_close: false        # ปิดไม้บางส่วนเมื่อถึง RR ที่ตั้ง
  enable_trailing     : false        # trailing stop
  enable_time_exit    : false        # ปิดไม้เมื่อถือครบเวลา
  be_after_rr         : 0.8          #   └ ขยับ BE เมื่อกำไรถึง 0.8R
  partial_close_rr    : 1.0          #   └ ปิดบางส่วนที่ 1.0R
  partial_close_pct   : 0.50         #   └ ปิดครึ่งไม้
  trailing_start_pct  : 0.0030       #   └ เริ่ม trail เมื่อกำไร 0.3% ของราคา
  trailing_distance_pct: 0.0020      #   └ ระยะ trail 0.2%
  max_hold_hours      : 8            #   └ ถือเกิน 8 ชม. ปิดทิ้ง

# ────────────── เกตรายสกุล (ปุ่มคุมความเสี่ยงตัวจริง) ──────────────
#  max_risk_pct = เพดาน "ความเสี่ยงจริงหลัง lot floor" — เกิน = บล็อกไม้นั้นทิ้ง
symbol_settings:
  XAUUSD:   # 🔓 ทองเปิดตามคำสั่ง 2026-07-12 — เสี่ยงจริง ~7-8%/ไม้ ลดไม่ได้เพราะ lot floor
    min_confidence     : 0.48        # ความมั่นใจขั้นต่ำเฉพาะทอง (แน่นกว่าคู่อื่น)
    max_session_losses : 3           # แพ้ครบ 3 ไม้ในเซสชัน → หยุดทองถึงรอบรีเซ็ต
    risk_multiplier    : 0.50        # ลดขนาดไม้ทองเหลือครึ่งของสูตรปกติ
    cooldown_after_loss: 60          # แพ้ทองแล้วพักทอง 60 นาที
    max_risk_pct       : 0.08        # เพดาน 3% — ปล่อยไม้ SL แคบ (~$7-8) บล็อกไม้ SL กว้าง ($10+)
  EURUSD:
    min_confidence     : 0.45        # ขั้นต่ำมาตรฐาน
    risk_multiplier    : 1.00        # ขนาดไม้ตามสูตรปกติ
    max_session_losses : 3           # แพ้ 3 ไม้/เซสชัน → พักคู่นี้
    cooldown_after_loss: 10          # แพ้แล้วพัก 10 นาที
    max_risk_pct       : 0.03        # เพดาน 2%/ไม้ — เกินนี้บล็อก
  GBPUSD:
    min_confidence     : 0.48        # ความมั่นใจขั้นต่ำเฉพาะปอนด์ (แน่นกว่าคู่อื่น)
    risk_multiplier    : 0.50        # ลดขนาดไม้ปอนด์เหลือครึ่งของสูตรปกติ
    max_session_losses : 3           # แพ้ครบ 3 ไม้ในเซสชัน → หยุดปอนด์ถึงรอบรีเซ็ต
    cooldown_after_loss: 60          # แพ้ปอนด์แล้วพักปอนด์ 60 นาที
    max_risk_pct       : 0.03        # เพดาน 8% — ปล่อยไม้ SL แคบ (~$7-8) บล็อกไม้ SL กว้าง ($10+)
  _default:                          # ค่าสำหรับ symbol ที่ไม่ได้ระบุข้างบน
    min_confidence     : 0.45
    risk_multiplier    : 1.00
    max_session_losses : 3
    cooldown_after_loss: 10
    max_risk_pct       : 0.015       # เพดานเข้มกว่า (1.5%) เพราะเป็นสกุลที่ไม่ได้ตั้งใจเทรด

# ────────────── ฝั่งเทรนโมเดล (ใช้ตอน retrain — ไม่มีผลกับ live) ──────────────
training:
  label_method  : "triple_barrier"   # วิธีติด label: บน/ล่าง/หมดเวลา
  forward_bars  : 6                  # มองไปข้างหน้า 6 แท่ง (M15 = 1.5 ชม.)
  tb_atr_mult   : 1.2                # ระยะ barrier = ±1.2×ATR (สมมาตร ตาม fix ก.ค.)
  min_return_pct: 0.0007             # ขยับต่ำกว่า 0.07% นับเป็น "ไม่ไปไหน"
  wf_gap_bars   : 96                 # เว้น gap 96 แท่งระหว่าง train/test กันข้อมูลรั่ว
  xgb_params:                        # พารามิเตอร์ XGBoost
    n_estimators    : 500            # จำนวนต้นไม้
    learning_rate   : 0.03           # อัตราเรียนรู้ — ต่ำ = ช้าแต่นิ่ง
    max_depth       : 6              # ความลึกต้นไม้ — ลึก = จับ pattern ซับซ้อนแต่เสี่ยง overfit
    min_child_weight: 10             # กัน overfit: ต้องมีข้อมูลพอถึงจะแตกกิ่ง
    subsample       : 0.8            # ใช้ข้อมูล 80% ต่อรอบ (สุ่ม)
    colsample_bytree: 0.8            # ใช้ features 80% ต่อต้น (สุ่ม)
  lgbm_params:                       # พารามิเตอร์ LightGBM
    num_leaves      : 63             # จำนวนใบต่อต้น — เยอะ = ซับซ้อนขึ้น
    learning_rate   : 0.03
    min_data_in_leaf: 50             # กัน overfit เหมือน min_child_weight
    feature_fraction: 0.8
    num_boost_round : 1000           # จำนวนรอบ boosting สูงสุด

# ────────────── ตำแหน่งไฟล์/โฟลเดอร์ ──────────────
paths:
  data_raw      : "data/raw"         # ข้อมูลดิบจาก MT5/Yahoo
  data_processed: "data/processed"   # ข้อมูลหลังทำ features
  models_saved  : "models/saved"     # ไฟล์โมเดลที่เทรนแล้ว
  logs          : "logs"             # log ระบบ
  db            : "db/trades.db"     # ฐานข้อมูลไม้เทรด (SQLite)
  reports       : "reports"          # รายงานสรุป
  flags         : "flags"            # ไฟล์ flag คุมสถานะ (เช่น pause)

# ────────────── logging ──────────────
logging:
  shadow_trades : true               # ⚠️ ต้องเปิดเสมอ: บันทึกไม้ที่โดนเกตตัด
                                     #    = ข้อมูลหลักไว้วิเคราะห์ว่า filter ช่วยหรือขวาง

# ────────────── dashboard local ──────────────
dashboard:
  port               : 8501          # เปิดดูที่ http://localhost:8501
  refresh_sec        : 30            # รีเฟรชหน้าจอทุก 30 วิ

# ────────────── แจ้งเตือน Telegram ──────────────
notifications:
  notify_on:                         # เหตุการณ์ที่ส่งแจ้งเตือน (true = ส่ง)
    order_open    : true             # เปิดไม้
    order_close   : true             # ปิดไม้
    order_failed  : true             # ส่งคำสั่งไม่สำเร็จ
    daily_summary : true             # สรุปประจำวัน
    daily_loss_hit: true             # เบรกรายวันทำงาน
  daily_summary_hour: 21             # ⚠️ ใช้ "เวลาเครื่อง" ไม่ใช่ UTC — ระวังตั้งผิด timezone

