# ============================================================
# TRADING BOT — MASTER CONFIG (Production-ready)
# แก้ไฟล์นี้ที่เดียว แล้ว nssm restart TradingBot
# ============================================================

# ── 0. BROKER ─────────────────────────────────────────────────
# Broker ที่ใช้อยู่ตอนนี้ — เปลี่ยน broker ใหม่แก้แค่บรรทัดนี้
# (ต้องมี mapping อยู่ใน symbol_map ข้อ 26 ด้วย)
broker:
  name: "exness"

# ── 1. MT5 CONNECTION ───────────────────────────────────────────
# ตั้งค่าการเชื่อมต่อ/reconnect กับ MetaTrader5
mt5:
  timeout_sec: 30
  max_reconnect_attempts: 5
  reconnect_delay_sec: 10
  reconnect:
    enabled              : true
    max_retries          : 10
    base_sleep_sec       : 5     # รอกี่วินาทีก่อนลองใหม่ครั้งแรก
    max_sleep_sec        : 300   # รอนานสุดกี่วินาทีระหว่างลองใหม่
    health_check_interval: 60
    alert_after_retries  : 3     # ลองครบกี่ครั้งแล้วค่อยแจ้งเตือน
    notify_telegram      : true

# ── 2. SYMBOLS ───────────────────────────────────────────────────
# คู่เงินที่บอทเทรด — ใช้ชื่อกลาง (ไม่มี m) ทุกที่ในระบบ
# ชื่อจริงของแต่ละ broker ถูกแปลงผ่าน symbol_map (ข้อ 26) อัตโนมัติ
symbols:
  active:
    - "XAUUSD"
    - "EURUSD"
    - "GBPUSD"
  primary_timeframe: "M15"   # timeframe หลักที่ใช้ตัดสินใจเทรด
  htf_timeframes:            # timeframe สูงกว่า ใช้เช็คเทรนด์ใหญ่ (HTF filter)
    - "H1"
    - "H4"

# ── 3. RISK MANAGEMENT ────────────────────────────────────────────
# กฎคุมความเสี่ยงต่อไม้/ต่อวัน
# (limit ขาดทุนรายวัน → ดูข้อ 16, limit spread → ดูข้อ 15)
risk:
  risk_per_trade           : 0.03   # เสี่ยงกี่% ของ balance ต่อไม้
  max_open_trades          : 8      # เปิดพร้อมกันได้สูงสุดกี่ไม้ (รวมทุก symbol)
  min_lot                  : 0.01
  max_lot                  : 0.50
  max_positions_per_symbol : 2      # เปิดซ้ำ symbol เดียวกันได้สูงสุดกี่ position
  add_same_direction_only  : true   # เพิ่ม position ที่ 2 ได้เฉพาะทิศทางเดิม (ห้ามสวนทาง)
  add_position_min_conf    : 0.52   # confidence ขั้นต่ำที่ต้องมีก่อนเพิ่ม position ที่ 2
  add_position_min_agree   : 2      # ต้องมี >= 2/3 โมเดลเห็นตรงกันก่อนเพิ่ม position

# ── 4. ORDER SETTINGS ─────────────────────────────────────────────
# ระยะ SL/TP และพฤติกรรมตอนส่ง order จริง
order:
  sl_points:                 # ระยะ Stop Loss (หน่วย points) ต่อ symbol
    XAUUSD: 100
    EURUSD:  80
    GBPUSD:  90
    default:  90
  tp_ratio: 0.7                # TP = SL × ค่านี้ (เก็บกำไรเร็ว)
  min_rr  : 0.5                # R:R ขั้นต่ำที่ยอมรับ — ตั้งให้ต่ำกว่า tp_ratio เสมอ
  tp_by_regime:                # ปรับ TP ตาม regime ที่ตรวจเจอ
    trending_up  : 1.5
    trending_down: 1.5
    uncertain    : 0.7
    ranging      : 0.6
    volatile     : 0.5
  use_trailing_stop    : true
  trailing_start_pct   : 0.003   # กำไรกี่% ก่อนเริ่ม trailing
  trailing_distance_pct: 0.002   # ระยะห่างของ trailing stop จากราคา
  max_slippage         : 10      # slippage ที่ยอมรับได้ (points)
  magic_number          : 20250101   # เลขระบุ order ของบอทนี้ (กันชนกับ EA อื่น)
  order_comment        : "aurum_bot_v1"

# ── 5. SIGNAL & MODEL ─────────────────────────────────────────────
# threshold การตัดสินใจของโมเดล
signal:
  active_model                      : "ensemble"   # rule_based | xgb | lgbm | lstm | ensemble
  min_confidence                    : 0.50     # confidence ขั้นต่ำที่จะเปิดไม้ (override ได้ที่ symbol_settings)
  lookback_bars                     : 200      # จำนวนแท่งย้อนหลังที่ใช้คำนวณ feature
  cooldown_min                      : 10       # พักกี่นาทีหลังเทรดก่อนเทรดรอบใหม่
  min_directional_prob              : 0.45   # ✅ FIX: เดิม 0.28 < random(0.33) → override บน noise / ต้องมั่นใจกว่า random 35%
  min_agree_for_directional_override: 2        # ต้อง >= 2/3 โมเดลเห็นตรงกันจึง override ทิศทางได้

# ── 6. TRADING SESSION (ด่านสำรอง) ────────────────────────────────
# ด่านเช็คเวลาแบบง่าย เป็นด่านที่ 2 รองจาก session_filter (ข้อ 21)
# ตอนนี้เทรดได้ทุก session (ดูข้อ 21) จึงเปิดกว้างทั้งวัน ไม่ใช่ตัวจำกัดจริง
session:
  allowed_hours_utc:
    start: 0
    end: 24
  skip_weekends     : true
  news_blackout_min : 20      # บล็อกกี่นาทีก่อน/หลังข่าวสำคัญ
  market_holidays:
    - "2026-01-01"
    - "2026-12-25"

# ── 7. DATA COLLECTION ────────────────────────────────────────────
# จำนวนแท่งราคาที่ดึงเก็บ และ symbol ฝั่ง macro ที่ใช้เป็น feature เสริม
data:
  history_bars:
    M15: 50000     # 50000 ÷ 96 = 520 วัน ≈ 2 ปี  ← เปลี่ยนจาก 10000
    H1:  12000     # 12000 ÷ 24 = 500 วัน ≈ 2 ปี  ← เปลี่ยนจาก 5000
    H4:  3000
  macro_symbols:
    DXY:    "DX-Y.NYB"
    US10Y:  "^TNX"
    VIX:    "^VIX"
    SILVER: "SI=F"
    OIL:    "CL=F"
  update_interval_hours: 24

# ── 8. MODEL TRAINING ─────────────────────────────────────────────
# พารามิเตอร์ตอน train โมเดล (ใช้โดย scripts/retrain_all.py)
training:
  retrain_every_days: 30
  train_pct: 0.70
  val_pct  : 0.15
  test_pct : 0.15
  label_method  : "triple_barrier"
  forward_bars  : 6
  min_return_pct: 0.0010
  wf_splits     : 5       # walk-forward กี่ splits
  wf_gap_bars   : 96      # เว้นระยะกี่แท่งระหว่าง train/test กัน look-ahead
  xgb_params:
    n_estimators    : 500
    learning_rate   : 0.03
    max_depth       : 6
    min_child_weight: 10
    subsample       : 0.8
    colsample_bytree: 0.8
  lgbm_params:
    num_leaves      : 63
    learning_rate   : 0.03
    min_data_in_leaf: 50
    feature_fraction: 0.8
    num_boost_round : 1000

# ── 9. PATHS ───────────────────────────────────────────────────────
# โฟลเดอร์ที่บอทใช้อ่าน/เขียนไฟล์
paths:
  data_raw      : "data/raw"
  data_processed: "data/processed"
  models_saved  : "models/saved"
  logs          : "logs"
  db            : "db/trades.db"
  reports       : "reports"
  flags         : "flags"

# ── 10. DASHBOARD ──────────────────────────────────────────────────
# ตั้งค่า Streamlit dashboard
dashboard:
  port               : 8501
  refresh_sec        : 30
  recent_trades_count: 50

# ── 11. NOTIFICATIONS ──────────────────────────────────────────────
# แจ้งเตือนผ่าน Telegram ตอนไหนบ้าง
notifications:
  telegram_enabled: true
  notify_on:
    order_open    : true
    order_close   : true
    order_failed  : true
    daily_summary : true
    bot_restart   : true
    daily_loss_hit: true
  daily_summary_hour: 21   # ส่งสรุปประจำวันกี่โมง UTC

# ── 12. LOGGING ─────────────────────────────────────────────────────
logging:
  level           : "INFO"
  max_file_size_mb: 10
  backup_count    : 5

# ── 13. NEWS FILTER ──────────────────────────────────────────────────
# บล็อกเทรดช่วงข่าวสำคัญ (high impact)
news_filter:
  enabled         : true
  buffer_minutes  : 10      # บล็อกกี่นาทีก่อน/หลังข่าว
  high_impact_only: true
  fail_open       : true    # ถ้าดึงข่าวไม่ได้ → ปล่อยให้เทรดต่อ (ไม่บล็อก)
  cache_hours     : 6

# ── 14. API KEYS ──────────────────────────────────────────────────────
api_keys:
  finnhub: "d8mu069r01qp7ubnsekgd8mu069r01qp7ubnsel0"
  # Finnhub  ดึงจาก ForexFactory แทนอัตโนมัติ (ฟรี ไม่ต้อง key)

# ── 15. SPREAD FILTER (จุดเดียวของระบบ) ──────────────────────────────
# spread กว้างเกินนี้ → ไม่ส่ง order (กันโดน slippage ช่วงข่าว/สภาพคล่องต่ำ)
spread_filter:
  enabled  : true
  fail_open: true   # ถ้าเช็ค spread ไม่ได้ → ปล่อยให้เทรดต่อ
  warn_pct : 70      # spread ใกล้ limit กี่% ถึงจะ log เตือน
  limits:
    XAUUSD : 0.80
    EURUSD : 0.00030
    GBPUSD : 0.00050
    default: 0.00100

# ── 16. CIRCUIT BREAKER (จุดเดียวของระบบสำหรับ daily-loss) ───────────
# หยุดเทรดอัตโนมัติเมื่อขาดทุนเกิน threshold แต่ละแบบ
circuit_breaker:
  enabled        : true
  notify_telegram: true
  daily:
    enabled    : true
    loss_pct   : 5.0      # หยุดถ้าขาดทุน 5% ของ balance ภายในวันเดียว
    loss_usd   : null     # ใส่จำนวนเงิน USD แทน % ได้ถ้าต้องการ
    auto_resume: true     # หยุดแล้วกลับมาเทรดเองอัตโนมัติเมื่อพ้นช่วง
  weekly:
    enabled : true
    loss_pct: 10.0        # หยุดถ้าขาดทุนสะสมเกิน 10% ภายในสัปดาห์
  consecutive_losses:
    enabled       : true
    count         : 5     # แพ้ติดกัน 5 ไม้ → หยุดพัก
    cooldown_hours: 1      # พักกี่ชั่วโมงก่อนเทรดต่อ
  floating_dd:
    enabled : true
    max_pct : 5.0      # floating drawdown (ขาดทุนที่ยังไม่ปิด) เกินนี้ → หยุด
    warn_pct: 70

# ── 17. REGIME DETECTION ─────────────────────────────────────────────
# พารามิเตอร์ตรวจจับสภาพตลาด (เทรนด์/sideway/ผันผวน)
regime_detection:
  adx_period       : 14
  adx_trend_thresh : 25     # ADX สูงกว่านี้ = ถือว่าเป็นเทรนด์
  adx_range_thresh : 20     # ADX ต่ำกว่านี้ = ถือว่า sideway
  hurst_trend      : 0.55
  hurst_range      : 0.45
  atr_lookback     : 100
  vol_high_mult    : 1.5
  ema_fast         : 20
  ema_slow         : 50
  ema_trend        : 200
  cache_ttl_minutes: 15

# ── 18. REGIME WEIGHTS ───────────────────────────────────────────────
# น้ำหนักของแต่ละโมเดลใน ensemble ตาม regime ที่ตรวจเจอ
regime_weights:
  trending_up  : {lgbm: 0.40, xgb: 0.35, lstm: 0.15, rule: 0.10}
  trending_down: {lgbm: 0.40, xgb: 0.35, lstm: 0.15, rule: 0.10}
  ranging      : {lgbm: 0.15, xgb: 0.15, lstm: 0.10, rule: 0.60}
  volatile     : {lgbm: 0.33, xgb: 0.33, lstm: 0.34, rule: 0.00}
  uncertain    : {lgbm: 0.30, xgb: 0.25, lstm: 0.20, rule: 0.25}

# ── 19. STRATEGY FILTERS ─────────────────────────────────────────────
# เปิด/ปิด filter แต่ละตัวก่อนยืนยันสัญญาณเทรด
strategy_filters:
  use_squeeze_filter   : false
  use_htf_filter       : false
  use_atr_low_filter   : false
  use_regime_filter    : true    # บล็อกเทรดสวนเทรนด์ใหญ่
  use_pattern_filter   : false
  use_structure_filter : false
  use_final_conf_check : false

# ── 20. REGIME FILTER ────────────────────────────────────────────────
# กฎละเอียดของ use_regime_filter (ข้อ 19)
regime_filter:
  block_counter_trend: true   # ตัวอย่าง: BUY ตอน regime=trending_down → บล็อก
  min_regime_conf    : 0.40   # ต้องมั่นใจ regime >= 40% ถึงจะใช้ filter นี้ตัดสิน
  blocked_combos:
    - {regime: trending_down, signal: BUY}
    - {regime: trending_up,   signal: SELL}

# ── 21. SESSION FILTER (ด่านหลัก, DST-aware) ─────────────────────────
# ด่านหลักที่ตัดสินว่าตอนนี้เทรดได้ไหม — เช็คก่อนสร้าง signal ทุกครั้ง
# ปรับเวลา New York อัตโนมัติตาม DST (EDT/EST)
session_filter:
  enabled     : true
  skip_weekend: true
  use_dst     : true
  overlap_only: false
  allowed_sessions:        # session ทั้งหมดที่ระบบรู้จัก
    - London    # 07:00-16:00 UTC
    - New York  # 12:00-21:00 UTC (EDT) / 13:00-22:00 UTC (EST)
    - Tokyo     # 00:00-09:00 UTC
    - Sydney    # 21:00-06:00 UTC
  symbol_sessions:          # session ที่อนุญาตให้เทรดได้ ต่อ symbol
    XAUUSD: ["Sydney", "Tokyo", "London", "New York"]
    EURUSD: ["Sydney", "Tokyo", "London", "New York"]
    GBPUSD: ["Sydney", "Tokyo", "London", "New York"]
  friday_close_hour: 21    # ตลาดปิดวันศุกร์กี่โมง UTC
  monday_open_hour :  7    # ตลาดเปิดวันจันทร์กี่โมง UTC

# ── 22. TRADE MANAGEMENT ─────────────────────────────────────────────
# การจัดการ position หลังเปิดไม้แล้ว
trade_management:
  max_hold_hours      : 4      # ถือเกินกี่ชั่วโมง → ปิดอัตโนมัติ
  be_after_rr         : 0.5    # กำไรถึง 0.5R → ย้าย SL ไปจุดเท่าทุน (breakeven)
  partial_close_rr    : 0.4    # กำไรถึง 40% ของ TP → ปิดครึ่ง position
  partial_close_pct   : 0.50
  enable_time_exit    : true
  enable_breakeven    : true
  enable_partial_close: true

# ── 23. PYRAMIDING ───────────────────────────────────────────────────
pyramiding:
  enabled: false   # เปิดเมื่อ win rate > 50% ต่อเนื่อง 2 สัปดาห์ (ยังไม่เปิดใช้)

# ── 24. SYMBOL SETTINGS ──────────────────────────────────────────────
# Override ค่า global (ข้อ 3, 5) เป็นรายตัว — ใช้ที่ bot/main.py และ bot/risk_manager.py
symbol_settings:
  XAUUSD:
    min_confidence     : 0.55  # เท่า global
    max_session_losses : 2     # แพ้ 2 ครั้ง → หยุด XAU จนกว่าจะ reset session ถัดไป
    risk_multiplier    : 0.50  # lot เล็กลงครึ่งหนึ่งเทียบกับ symbol อื่น
    cooldown_after_loss: 10    # พัก 10 นาทีหลังแพ้ ก่อนเทรด XAU ใหม่
  EURUSD:
    min_confidence     : 0.55
    risk_multiplier    : 1.00
    max_session_losses : 3
    cooldown_after_loss: 10
  GBPUSD:
    min_confidence     : 0.55
    risk_multiplier    : 1.00
    max_session_losses : 3
    cooldown_after_loss: 10
  _default:                    # ใช้กับ symbol ที่ไม่ได้ระบุไว้ด้านบน
    min_confidence     : 0.55
    risk_multiplier    : 1.00
    max_session_losses : 3
    cooldown_after_loss: 10

# ── 25. DAILY TRACKING ───────────────────────────────────────────────
# กำหนดเวลา reset ตัวนับ session-loss (symbol_settings.*.max_session_losses)
# เพื่อให้บอทไม่หยุดยาวทั้งวันแค่เพราะแพ้ติดในช่วงเดียว
daily_tracking:
  reset_hours_utc: [6, 13, 21]  # Reset ตอน Asia / London / NY เปิด

# ── 26. SYMBOL MAP (broker-agnostic) ─────────────────────────────────
# ชื่อ "กลาง" (ซ้าย) ที่ใช้ทุกที่ในระบบ → ชื่อจริงของแต่ละ broker (ขวา)
# ย้าย broker ใหม่: 1) เปลี่ยน broker.name (ข้อ 0)  2) เพิ่มแถวที่นี่ถ้ายังไม่มี
symbol_map:
  XAUUSD:
    exness     : "XAUUSDm"
    icmarkets  : "XAUUSD"
    pepperstone: "XAUUSD"
    oanda      : "XAU_USD"
    fxcm       : "XAU/USD"
  EURUSD:
    exness     : "EURUSDm"
    icmarkets  : "EURUSD"
    pepperstone: "EURUSD"
    oanda      : "EUR_USD"
    fxcm       : "EUR/USD"
  GBPUSD:
    exness     : "GBPUSDm"
    icmarkets  : "GBPUSD"
    pepperstone: "GBPUSD"
    oanda      : "GBP_USD"
    fxcm       : "GBP/USD"