# ============================================================
# TRADING BOT — MASTER CONFIG  (Production-ready)
# แก้ไฟล์นี้ที่เดียว แล้ว nssm restart TradingBot
# ============================================================
# ── 1. MT5 & BROKER ─────────────────────────────────────────
mt5:
  # ⚠️  terminal_path มาจาก .env (MT5_PATH) — ไม่ต้องใส่ที่นี่
  #     login / password / server มาจาก .env เช่นกัน

  # timeout รอ MT5 response (วินาที)
  timeout_sec: 30

  # reconnect กี่ครั้งถ้าหลุด (legacy — ยังคงไว้ backward compat)
  max_reconnect_attempts: 5

  # รอกี่วินาทีระหว่าง reconnect attempt (legacy)
  reconnect_delay_sec: 10

  # ── Auto-Reconnect (ใหม่) ──────────────────────────────────
  reconnect:
    enabled              : true
    max_retries          : 10    # retry สูงสุด 10 ครั้ง
    base_sleep_sec       : 5     # เริ่มที่ 5s → 10 → 20 → 40 → ... → 300s
    max_sleep_sec        : 300   # สูงสุด 5 นาทีต่อครั้ง
    health_check_interval: 60    # ตรวจ connection ทุก 60 วินาที (ไม่ตรวจทุก tick)
    alert_after_retries  : 3     # ส่ง Telegram เมื่อ retry ครั้งที่ 3
    notify_telegram      : true  # ส่ง alert ทุก reconnect event

# ── 2. SYMBOLS ───────────────────────────────────────────────
symbols:
  # รายการ symbol ที่บอทจะเทรด
  # ⚠️  เพิ่ม/ลบที่นี่ แล้วต้อง retrain โมเดลใหม่
  active:
    - "XAUUSDm"    # ทองคำ (main)
    - "EURUSDm"    # EUR/USD
    - "GBPUSDm"    # GBP/USD
  # - "USDJPYm"   ← uncomment เมื่อพร้อม

  # timeframe หลักที่บอทวิ่ง
  primary_timeframe: "M15"

  # timeframe เสริมสำหรับ multi-timeframe analysis
  htf_timeframes:
    - "H1"
    - "H4"

# ── 3. RISK MANAGEMENT ──────────────────────────────────────
risk:
  # % ของ balance ที่เสี่ยงต่อ 1 trade
  # 0.01 = 1% | แนะนำ 0.005–0.01 สำหรับ production
  risk_per_trade: 0.01

  # หยุดเทรดทั้งวันถ้าขาดทุนเกิน % นี้
  # 0.05 = 5% ของ balance วันนั้น
  max_daily_loss_pct: 0.10

  # จำนวน position สูงสุดที่เปิดพร้อมกันได้
  max_open_trades: 3

  # ไม่เทรดถ้า spread กว้างกว่านี้ (หน่วย: points)
  # XAUUSDm: 30 points ≈ 3 pips | Forex majors: 15 points
  max_spread_points:
    XAUUSDm: 300
    EURUSDm: 15
    GBPUSDm: 20
    default: 25

  # ขนาด lot ต่ำสุด/สูงสุด (override broker limit)
  min_lot: 0.01
  max_lot: 0.50


# ── 4. ORDER SETTINGS ───────────────────────────────────────
order:
  # ระยะ Stop Loss (หน่วย: points)
  # ⚠️  ลด SL ให้แน่นขึ้น → risk ต่อ trade ลดลง
  # XAUUSDm: 150→100 pts = 10 pips ($1.00/0.01lot) | ก่อนหน้า $1.50
  sl_points:
    XAUUSDm: 100   # ลดจาก 150 → แน่นขึ้น ออกเร็วถ้าผิดทาง
    EURUSDm:  80   # ลดจาก 120
    GBPUSDm:  90   # ลดจาก 130
    default:  90

  # Take Profit = SL × tp_ratio
  # ⚠️  ลด RR จาก 1:2 → 1:1.2
  # เหตุผล: TP 1:2 ไม่เคยถูกแตะ → ลดให้ถึงง่ายขึ้น
  # คณิต: ต้องชนะ 46% (1:1.2) แทน 33% (1:2)
  #        แต่ TP ใกล้กว่า = win rate จริงสูงกว่า
  tp_ratio: 1.2

  # Trailing Stop — เปิด/ปิด
  use_trailing_stop: true

  # เริ่ม trailing เมื่อกำไรถึง 0.5R (ครึ่งทาง TP)
  trailing_start_pct: 0.005   # ปรับจาก 0.008 → เริ่ม trail เร็วขึ้น

  # trailing distance — lock กำไรไว้
  trailing_distance_pct: 0.003  # ปรับจาก 0.005 → ชิดขึ้น lock กำไรได้มากกว่า

  # slippage ที่ยอมรับได้ (points)
  max_slippage: 10

  # magic number — ระบุ order ว่ามาจากบอทนี้
  # ⚠️  ห้ามซ้ำกับบอทอื่นบน account เดียวกัน
  magic_number: 20250101

  # comment ใน order (เห็นใน MT5 history)
  order_comment: "aurum_bot_v1"

# ── 5. SIGNAL & MODEL ───────────────────────────────────────
signal:
  # โมเดลที่ใช้ตอนนี้
  # ตัวเลือก: "rule_based" | "xgb" | "lgbm" | "lstm" | "ensemble"
  active_model: "ensemble"

  # confidence ขั้นต่ำที่จะส่ง order
  # ยิ่งสูง = trade น้อยลงแต่คุณภาพดีขึ้น
  # แนะนำ: 0.60–0.70
  # ⚠️  HOTFIX: 0.40 ต่ำมาก (baseline random = 0.33) → เปลี่ยนเป็น 0.62
  min_confidence: 0.62

  # จำนวน bar ล่าสุดที่ส่งให้โมเดล predict
  lookback_bars: 200

  # ป้องกันเทรดซ้ำ symbol เดิมภายใน n นาที
  cooldown_min: 30

# ── 6. TRADING SESSION ──────────────────────────────────────
session:
  # เทรดเฉพาะช่วงนี้ (UTC)
  # London: 07:00–16:00 | New York: 12:00–21:00
  # Overlap ที่ดีที่สุด: 12:00–16:00 UTC
  allowed_hours_utc:
    start: 7
    end: 20

  # ไม่เทรดวันเสาร์-อาทิตย์
  skip_weekends: true

  # ไม่เทรด n นาทีก่อน/หลัง ข่าวสำคัญ (ถ้าเปิด news filter)
  news_blackout_min: 30

  # วันหยุดตลาด — ไม่เทรด (อัปเดตทุกปี)
  market_holidays:
    - "2026-01-01"   # New Year
    - "2026-12-25"   # Christmas 2026

# ── 7. DATA COLLECTION ──────────────────────────────────────
data:
  # จำนวน bar ย้อนหลังที่ดึงมา train
  history_bars:
    M15: 10000    # ≈ 2 ปี
    H1:  5000
    H4:  2000

  # Macro data sources (ผ่าน yfinance)
  macro_symbols:
    DXY:    "DX-Y.NYB"    # Dollar Index
    US10Y:  "^TNX"        # US 10-Year Bond Yield
    VIX:    "^VIX"        # Volatility Index
    SILVER: "SI=F"        # Silver Futures
    OIL:    "CL=F"        # Crude Oil (optional)

  # อัปเดต data ทุกกี่ชั่วโมง (Task Scheduler รัน)
  update_interval_hours: 24

# ── 8. MODEL TRAINING ───────────────────────────────────────
training:
  # retrain โมเดลอัตโนมัติทุกกี่วัน
  retrain_every_days: 30

  # สัดส่วน train / validation / test (รวมต้องเท่ากับ 1.0)
  train_pct: 0.70
  val_pct:   0.15
  test_pct:  0.15

  # วิธี label — triple_barrier แนะนำสำหรับ production
  label_method: "triple_barrier"

  # ✅ FIX: ลบ duplicate keys (forward_bars / min_return_pct เคยซ้ำ 2 ครั้ง)
  # กี่ bar ข้างหน้าที่ใช้วัด return  (4 × M15 = 1 ชั่วโมง)
  forward_bars: 4

  # return ขั้นต่ำที่จะ label เป็น BUY/SELL (น้อยกว่านี้ = HOLD)
  min_return_pct: 0.0015   # 0.15%

  # จำนวน fold ใน walk-forward validation
  wf_splits: 5

  # gap ระหว่าง train และ test (bars) — ป้องกัน data leak
  wf_gap_bars: 96   # 1 วัน สำหรับ M15

  # XGBoost default params (Optuna จะ override ถ้ารัน hyperopt)
  xgb_params:
    n_estimators:     500
    learning_rate:    0.03
    max_depth:        6
    min_child_weight: 10
    subsample:        0.8
    colsample_bytree: 0.8

  # LightGBM default params
  lgbm_params:
    num_leaves:       63
    learning_rate:    0.03
    min_data_in_leaf: 50
    feature_fraction: 0.8
    num_boost_round:  1000

# ── 9. PATHS ────────────────────────────────────────────────
paths:
  data_raw:       "data/raw"
  data_processed: "data/processed"
  models_saved:   "models/saved"
  logs:           "logs"
  db:             "db/trades.db"
  reports:        "reports"
  flags:          "flags"

# ── 10. DASHBOARD ───────────────────────────────────────────
dashboard:
  # port ของ Streamlit
  port: 8501

  # รีเฟรชทุกกี่วินาที
  refresh_sec: 30

  # แสดง trade ล่าสุดกี่รายการ
  recent_trades_count: 50

# ── 11. NOTIFICATIONS ───────────────────────────────────────
notifications:
  # เปิด/ปิด Telegram alerts
  telegram_enabled: true

  # แจ้งเตือนเมื่อ
  notify_on:
    order_open:     true
    order_close:    true
    order_failed:   true
    daily_summary:  true    # สรุปทุกวัน
    bot_restart:    true
    daily_loss_hit: true    # แจ้งเมื่อ daily loss limit เตะ

  # เวลาส่ง daily summary (UTC)
  daily_summary_hour: 21


# ── 12. LOGGING ─────────────────────────────────────────────
logging:
  level: "INFO"           # DEBUG | INFO | WARNING | ERROR
  max_file_size_mb: 10
  backup_count: 5         # เก็บ log ย้อนหลัง 5 ไฟล์

# ── 13. News Filter ──────────────────────────────────────────
news_filter:
  enabled: true
  buffer_minutes: 30        # บล็อก 30 นาทีก่อน/หลังข่าว
  high_impact_only: true    # เฉพาะ High impact เท่านั้น
  fail_open: true           # true = ให้เทรดต่อถ้า API ล้มเหลว
  cache_hours: 6            # refresh ทุก 6 ชั่วโมง
  keywords: []              # เพิ่ม keywords พิเศษถ้าต้องการ

# ── 14. API Keys ─────────────────────────────────────────────
api_keys:
  finnhub: "d8mu069r01qp7ubnsekgd8mu069r01qp7ubnsel0" # ใส่ key finnhub.io

# ── 15. Spread Filter ────────────────────────────────────────
spread_filter:
  enabled    : true
  fail_open  : true     # true = ให้เทรดต่อถ้า MT5 ดึง tick ไม่ได้
  warn_pct   : 70       # log warning เมื่อ spread ถึง 70% ของ limit

  limits:
    # ── ทอง ──────────────────────────────────────────────────
    XAUUSDm  : 0.80     # $0.80 (ปกติ ~$0.25-0.35, block ถ้า >$0.80)
    XAUUSD   : 0.80

    # ── Forex ─────────────────────────────────────────────────
    EURUSDm  : 0.00030  # 3 pips  (ปกติ ~0.5-1.0 pip)
    GBPUSDm  : 0.00050  # 5 pips  (ปกติ ~0.7-1.5 pip)

    # ── Default ───────────────────────────────────────────────
    default  : 0.00100  # 10 pips สำหรับ symbol ที่ไม่ได้ระบุ

circuit_breaker:
  enabled           : true
  notify_telegram   : true   # ส่งแจ้งเตือน Telegram เมื่อ trigger

  # ── 16. Daily loss limit ──────────────────────────────────────
  daily:
    enabled     : true
    loss_pct    : 2.0        # ลดจาก 3.0 → หยุดที่ 2% (~$10 จาก $500)
    loss_usd    : null
    auto_resume : true

  # ── 17. Weekly loss limit ─────────────────────────────────────
  weekly:
    enabled     : true
    loss_pct    : 8.0        # หยุดถ้าขาดทุนสะสม 7 วัน > 8%
                             # ต้อง /resume เองเท่านั้น

  # ── 18. Consecutive losses ────────────────────────────────────
  consecutive_losses:
    enabled         : true
    count           : 3      # ลดจาก 5 → หยุดถ้าแพ้ติด 3 ครั้ง
    cooldown_hours  : 4

  # ── 19. Floating drawdown (real-time) ─────────────────────────
  floating_dd:
    enabled     : true
    max_pct     : 3.0        # ลดจาก 5.0 → หยุดถ้า equity ต่ำกว่า balance > 3%
    warn_pct    : 70

#-----20. regime detection settings
regime_detection:
  adx_period        : 14
  adx_trend_thresh  : 25       # ADX > 25 = trending
  adx_range_thresh  : 20       # ADX < 20 = ranging
  hurst_trend       : 0.55     # H > 0.55 = persistent
  hurst_range       : 0.45     # H < 0.45 = mean-reverting
  atr_lookback      : 100      # historical ATR window
  vol_high_mult     : 1.5      # ATR ratio > 1.5 = high volatility
  ema_fast          : 20
  ema_slow          : 50
  ema_trend         : 200
  cache_ttl_minutes : 15       # cache 15 นาที (M15 candle)

#-----21. regime-based model weights (ปรับ tune ได้)
regime_weights:
  trending_up  : {lgbm: 0.40, xgb: 0.35, lstm: 0.15, rule: 0.10}
  trending_down: {lgbm: 0.40, xgb: 0.35, lstm: 0.15, rule: 0.10}
  ranging      : {lgbm: 0.20, xgb: 0.20, lstm: 0.10, rule: 0.50}
  volatile     : {lgbm: 0.33, xgb: 0.33, lstm: 0.34, rule: 0.00}
  uncertain    : {lgbm: 0.33, xgb: 0.33, lstm: 0.34, rule: 0.00}

#-----22. strategy filters (สวิตช์เปิด/ปิดตัวกรองต่างๆ)
strategy_filters:
  use_squeeze_filter: false    # false = ปิดการบล็อกกราฟบีบตัว (เทรดบ่อยขึ้น)
  use_htf_filter: false        # false = ปิดการเช็คไทม์เฟรม H1, H4 ขัดแย้ง
  use_atr_low_filter: false    # false = ปิดการบล็อกวอลุ่มต่ำ
  use_regime_filter: false     # false = ปิดการแยก regime (เทรดทุก regime)

#-----23. Session Filter ────────────────────────────────────────
session_filter:
  enabled       : true
  skip_weekend  : true
  use_dst       : true          # ปรับ NY session ตาม US DST อัตโนมัติ
  overlap_only  : false         # true = เทรดเฉพาะ 12:00-16:00 UTC เท่านั้น

  # ── Sessions ที่อนุญาต (default สำหรับทุก symbol) ─────────
  allowed_sessions:
    - London                    # 07:00-16:00 UTC (ตลอดปี)
    - New York                  # 12:00-21:00 UTC (EDT) / 13:00-22:00 UTC (EST)

  # ── Per-symbol override ────────────────────────────────────
  symbol_sessions:
    XAUUSDm: ["London", "New York"]   # ทอง → London + NY
    EURUSDm: ["London", "New York"]   # EUR  → London + NY
    GBPUSDm: ["London", "New York"]   # GBP  → London + NY

  # ── Weekend rules ──────────────────────────────────────────
  friday_close_hour : 21        # หยุดหลัง 21:00 UTC Friday
  monday_open_hour  :  7        # เริ่มได้ 07:00 UTC Monday (London open)

  # ── Session Times Reference ────────────────────────────────
  # Session   │ UTC (EDT/Summer) │ UTC (EST/Winter)
  # ──────────┼──────────────────┼──────────────────
  # Sydney    │ 21:00 – 06:00   │ 21:00 – 06:00
  # Tokyo     │ 00:00 – 09:00   │ 00:00 – 09:00
  # London    │ 07:00 – 16:00   │ 07:00 – 16:00
  # New York  │ 12:00 – 21:00   │ 13:00 – 22:00
  # Overlap ⚡│ 12:00 – 16:00   │ 13:00 – 17:00
  # ทองทำ move ใหญ่ที่สุดใน London+NY Overlap
  # เพราะ liquidity จาก European + US traders พร้อมกัน
  # ถ้าต้องการเทรดเฉพาะช่วงนี้: overlap_only: true

  #--------------------------------------------------------------------------------------------------------------------------------

#-----24. Trade Management (ใหม่) ──────────────────────────────
trade_management:
  # ── Time-based Exit ──────────────────────────────────────────
  # ปิด position อัตโนมัติถ้าถือนานเกินไปโดยไม่ถึง TP/SL
  max_hold_hours  : 4       # ปิดถ้าถือ > 4 ชั่วโมง (ป้องกันค้างข้ามคืน)

  # ── Breakeven ────────────────────────────────────────────────
  # ย้าย SL → entry เมื่อกำไรถึง X เท่าของ risk
  be_after_rr     : 0.5    # กำไรถึง 0.5R → ย้าย SL → breakeven (ไม่ขาดทุนแล้ว)

  # ── Partial Close ────────────────────────────────────────────
  # ปิดบางส่วนเพื่อ "เก็บกำไรระหว่างทาง"
  partial_close_rr: 1.0    # กำไรถึง 1R → ปิด 50% ก่อน
  partial_close_pct: 0.50  # ปิดกี่ % ของ position (0.50 = ครึ่งนึง)

  # ── Enabled Flags ────────────────────────────────────────────
  enable_time_exit    : true
  enable_breakeven    : true
  enable_partial_close: true

#-----25. Pyramiding / Scaling In (ใหม่ — ปิดไว้ก่อน) ──────────
# เปิดเมื่อระบบ win rate > 50% ต่อเนื่อง 2 สัปดาห์เท่านั้น
pyramiding:
  enabled            : false   # ⚠️  เปิดเมื่อพร้อมจริงๆ เท่านั้น

  # กติกา: เพิ่ม position เมื่อ trade ปัจจุบันกำไรถึง X R
  add_at_rr          : 1.0    # เพิ่มออเดอร์เมื่อกำไรถึง 1R
  add_volume_pct     : 0.50   # ออเดอร์ใหม่ = 50% ของ lot เดิม

  # ขอบเขตความเสี่ยง
  max_pyramid_levels : 2       # เพิ่มได้สูงสุด 2 ครั้ง (ออเดอร์รวม 3)
  max_total_risk_pct : 0.02   # risk รวมทุก pyramid ≤ 2% ของ balance

  # SL ของออเดอร์ที่เพิ่ม: ย้ายมาที่ breakeven ของออเดอร์แรก
  pyramid_sl_at_be   : true   # true = ออเดอร์ใหม่ SL อยู่ที่ entry ออเดอร์แรก