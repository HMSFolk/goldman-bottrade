# TRADING BOT — MASTER CONFIG  (Production-ready)
# แก้ไฟล์นี้ที่เดียว แล้ว nssm restart TradingBot
# ============================================================
# ── 0. BROKER ─────────────────────────────────────────────────
# เปลี่ยน broker → แก้ "name" บรรทัดเดียว (ดู symbol_map ข้อ 26)
broker:
  name: "exness"

# ── 1. MT5 CONNECTION ───────────────────────────────────────────
mt5:
  timeout_sec: 30
  max_reconnect_attempts: 5
  reconnect_delay_sec: 10
  reconnect:
    enabled              : true
    max_retries          : 10
    base_sleep_sec       : 5
    max_sleep_sec        : 300
    health_check_interval: 60
    alert_after_retries  : 3
    notify_telegram      : true

# ── 2. SYMBOLS ───────────────────────────────────────────────────
# ชื่อกลาง (ไม่มี m) — broker จริงถูก resolve ผ่าน symbol_map (ข้อ 26)
symbols:
  active:
    - "XAUUSD"
    - "EURUSD"
    - "GBPUSD"
  primary_timeframe: "M15"
  htf_timeframes:
    - "H1"
    - "H4"

# ── 3. RISK MANAGEMENT ────────────────────────────────────────────
# Daily-loss limit และ spread limit ย้ายไปอยู่จุดเดียวแล้ว:
#   daily loss → circuit_breaker.daily.loss_pct (ข้อ 16)
#   spread     → spread_filter.limits (ข้อ 15)
risk:
  risk_per_trade           : 0.03   # 3% balance ต่อ trade
  max_open_trades          : 8
  min_lot                  : 0.01
  max_lot                  : 0.50
  max_positions_per_symbol : 2      # อนุญาต 2 position/symbol
  add_same_direction_only  : true   # ห้ามเปิดสวนทาง
  add_position_min_conf    : 0.52   # conf ขั้นต่ำเพื่อเพิ่ม position ที่ 2
  add_position_min_agree   : 2      # >= 2/3 โมเดลต้องเห็นตรงกันจึงเพิ่ม position

# ── 4. ORDER SETTINGS ─────────────────────────────────────────────
order:
  sl_points:
    XAUUSD: 100
    EURUSD:  80
    GBPUSD:  90
    default:  90
  tp_ratio: 0.7              # TP = SL × 0.7 (เก็บกำไรเร็วขึ้น)
  tp_by_regime:
    trending_up  : 1.5
    trending_down: 1.5
    uncertain    : 0.7
    ranging      : 0.6
    volatile     : 0.5
  use_trailing_stop    : true
  trailing_start_pct   : 0.003
  trailing_distance_pct: 0.002
  max_slippage         : 10
  magic_number         : 20250101
  order_comment        : "aurum_bot_v1"

# ── 5. SIGNAL & MODEL ─────────────────────────────────────────────
signal:
  active_model                      : "ensemble"
  min_confidence                    : 0.55   # threshold global (symbol_settings override ได้)
  lookback_bars                     : 200
  cooldown_min                      : 10     # พักกี่นาทีหลังเทรด
  min_directional_prob              : 0.28   # BUY/SELL prob ขั้นต่ำก่อน directional override
  min_agree_for_directional_override: 2      # >= 2/3 โมเดลเห็นตรงกันจึง override

# ── 6. TRADING SESSION (ด่านสำรอง) ────────────────────────────────
# ด่านหลักของ session คือ session_filter (ข้อ 21, DST-aware) — อันนี้เป็น
# ด่านสำรองชั้นที่ 2 ที่ executor เช็คอีกรอบก่อนส่ง order จริง
# ⚠️ end ต้องครอบคลุม NY session close ของ session_filter เสมอ (สูงสุด
# 22:00 UTC ช่วง EST) ไม่งั้น order จะถูกบล็อกผิดช่วงปลาย NY session
session:
  allowed_hours_utc:
    start: 7
    end: 22
  skip_weekends     : true
  news_blackout_min : 20
  market_holidays:
    - "2026-01-01"
    - "2026-12-25"

# ── 7. DATA COLLECTION ────────────────────────────────────────────
data:
  history_bars:
    M15: 10000
    H1:  5000
    H4:  2000
  macro_symbols:
    DXY:    "DX-Y.NYB"
    US10Y:  "^TNX"
    VIX:    "^VIX"
    SILVER: "SI=F"
    OIL:    "CL=F"
  update_interval_hours: 24

# ── 8. MODEL TRAINING ─────────────────────────────────────────────
training:
  retrain_every_days: 30
  train_pct: 0.70
  val_pct  : 0.15
  test_pct : 0.15
  label_method  : "triple_barrier"
  forward_bars  : 4
  min_return_pct: 0.0015
  wf_splits     : 5
  wf_gap_bars   : 96
  xgb_params:
    n_estimators    : 500
    learning_rate   : 0.03
    max_depth       : 6
    min_child_weight: 10
    subsample       : 0.8
    colsample_bytree: 0.8
  lgbm_params:
    num_leaves      : 63
    learning_rate   : 0.03
    min_data_in_leaf: 50
    feature_fraction: 0.8
    num_boost_round : 1000

# ── 9. PATHS ───────────────────────────────────────────────────────
paths:
  data_raw      : "data/raw"
  data_processed: "data/processed"
  models_saved  : "models/saved"
  logs          : "logs"
  db            : "db/trades.db"
  reports       : "reports"
  flags         : "flags"

# ── 10. DASHBOARD ──────────────────────────────────────────────────
dashboard:
  port               : 8501
  refresh_sec        : 30
  recent_trades_count: 50

# ── 11. NOTIFICATIONS ──────────────────────────────────────────────
notifications:
  telegram_enabled: true
  notify_on:
    order_open    : true
    order_close   : true
    order_failed  : true
    daily_summary : true
    bot_restart   : true
    daily_loss_hit: true
  daily_summary_hour: 21

# ── 12. LOGGING ─────────────────────────────────────────────────────
logging:
  level           : "INFO"
  max_file_size_mb: 10
  backup_count    : 5

# ── 13. NEWS FILTER ──────────────────────────────────────────────────
news_filter:
  enabled         : true
  buffer_minutes  : 15      # บล็อก 15 นาทีก่อน/หลังข่าว HIGH impact
  high_impact_only: true
  fail_open       : true    # ถ้า API ล้มเหลว → เทรดต่อ
  cache_hours     : 6

# ── 14. API KEYS ──────────────────────────────────────────────────────
api_keys:
  finnhub: "d8mu069r01qp7ubnsekgd8mu069r01qp7ubnsel0"
  # Finnhub free plan ไม่รองรับ economic calendar — บอทใช้ ForexFactory

# ── 15. SPREAD FILTER (จุดเดียวของระบบ) ──────────────────────────────
# executor.send_order() เช็ค spread ผ่าน check_spread() ที่นี่ที่เดียว
spread_filter:
  enabled  : true
  fail_open: true
  warn_pct : 70
  limits:
    XAUUSD : 0.80
    EURUSD : 0.00030
    GBPUSD : 0.00050
    default: 0.00100

# ── 16. CIRCUIT BREAKER ──────────────────────────────────────────────
circuit_breaker:
  enabled        : true
  notify_telegram: true
  daily:
    enabled    : true       # ← daily-loss limit จุดเดียวของระบบ
    loss_pct   : 5.0        # หยุดถ้าขาดทุน 5%/วัน
    loss_usd   : null
    auto_resume: true
  weekly:
    enabled : true
    loss_pct: 10.0        # หยุดถ้าขาดทุนสะสม > 8%/สัปดาห์
  consecutive_losses:
    enabled       : true
    count         : 5    # แพ้ 3 ครั้งติด → หยุด
    cooldown_hours: 1
  floating_dd:
    enabled : true
    max_pct : 5.0
    warn_pct: 70

# ── 17. REGIME DETECTION ─────────────────────────────────────────────
regime_detection:
  adx_period       : 14
  adx_trend_thresh : 25
  adx_range_thresh : 20
  hurst_trend      : 0.55
  hurst_range      : 0.45
  atr_lookback     : 100
  vol_high_mult    : 1.5
  ema_fast         : 20
  ema_slow         : 50
  ema_trend        : 200
  cache_ttl_minutes: 15

# ── 18. REGIME WEIGHTS ───────────────────────────────────────────────
regime_weights:
  trending_up  : {lgbm: 0.40, xgb: 0.35, lstm: 0.15, rule: 0.10}
  trending_down: {lgbm: 0.40, xgb: 0.35, lstm: 0.15, rule: 0.10}
  ranging      : {lgbm: 0.15, xgb: 0.15, lstm: 0.10, rule: 0.60}
  volatile     : {lgbm: 0.33, xgb: 0.33, lstm: 0.34, rule: 0.00}
  uncertain    : {lgbm: 0.30, xgb: 0.25, lstm: 0.20, rule: 0.25}

# ── 19. STRATEGY FILTERS ─────────────────────────────────────────────
strategy_filters:
  use_squeeze_filter   : false
  use_htf_filter       : false
  use_atr_low_filter   : false
  use_regime_filter    : true    # block counter-trend
  use_pattern_filter   : false
  use_structure_filter : false
  use_final_conf_check : false

# ── 20. REGIME FILTER ────────────────────────────────────────────────
regime_filter:
  block_counter_trend: true   # BUY ใน trending_down = block
  min_regime_conf    : 0.40   # ต้องมั่นใจ regime >= 40%
  blocked_combos:
    - {regime: trending_down, signal: BUY}
    - {regime: trending_up,   signal: SELL}

# ── 21. SESSION FILTER (ด่านหลัก, DST-aware) ─────────────────────────
session_filter:
  enabled     : true
  skip_weekend: true
  use_dst     : true
  overlap_only: false
  allowed_sessions:
    - London    # 07:00-16:00 UTC
    - New York  # 12:00-21:00 UTC (EDT) / 13:00-22:00 UTC (EST)
    # - Tokyo   # ไม่ใช้ เพราะทุก symbol ใช้ symbol_sessions แทน
  symbol_sessions:
    XAUUSD: ["London", "New York"]
    EURUSD: ["London", "New York"]
    GBPUSD: ["London", "New York"]
  friday_close_hour: 21
  monday_open_hour :  7

# ── 22. TRADE MANAGEMENT ─────────────────────────────────────────────
trade_management:
  max_hold_hours      : 4     # ปิดถ้าถือ > 4 ชั่วโมง
  be_after_rr         : 0.5   # กำไร 0.5R → ย้าย SL breakeven
  partial_close_rr    : 0.4   # กำไร 40% TP → ปิดครึ่ง position
  partial_close_pct   : 0.50
  enable_time_exit    : true
  enable_breakeven    : true
  enable_partial_close: true

# ── 23. PYRAMIDING ───────────────────────────────────────────────────
pyramiding:
  enabled: false   # เปิดเมื่อ win rate > 50% ต่อเนื่อง 2 สัปดาห์

# ── 24. SYMBOL SETTINGS ──────────────────────────────────────────────
# Override global settings ต่อ symbol — อ่านที่ bot/main.py และ bot/risk_manager.py
symbol_settings:
  XAUUSD:
    min_confidence     : 0.75  # สูงกว่า global (model bias BUY)
    max_session_losses : 1     # แพ้ 1 ครั้ง → หยุด XAU ทั้ง session
    risk_multiplier    : 0.50  # lot เล็กลง 50%
    cooldown_after_loss: 60    # พัก 60 นาทีหลังแพ้
  EURUSD:
    min_confidence     : 0.55
    risk_multiplier    : 1.00
    max_session_losses : 3
    cooldown_after_loss: 15
  GBPUSD:
    min_confidence     : 0.55
    risk_multiplier    : 1.00
    max_session_losses : 3
    cooldown_after_loss: 15
  _default:
    min_confidence     : 0.55
    risk_multiplier    : 1.00
    max_session_losses : 3
    cooldown_after_loss: 15

# ── 25. DAILY TRACKING ───────────────────────────────────────────────
# Reset per-symbol session-loss counter (symbol_settings.*.max_session_losses)
# 3 รอบต่อวัน แทนที่จะหยุดยาวทั้งวัน
daily_tracking:
  reset_hours_utc: [6, 13, 21]  # Session: Asian / London / NY

# ── 26. SYMBOL MAP (broker-agnostic) ─────────────────────────────────
# ชื่อ "กลาง" (ซ้าย) ที่ใช้ทุกที่ในระบบ → ชื่อจริงของแต่ละ broker (ขวา)
# ย้าย broker ใหม่: 1) เปลี่ยน broker.name ข้อ 0  2) เพิ่มแถวที่นี่ถ้ายังไม่มี
# ไม่ต้องแก้ไฟล์โค้ดเลยสักไฟล์
symbol_map:
  XAUUSD:
    exness     : "XAUUSDm"
    icmarkets  : "XAUUSD"
    pepperstone: "XAUUSD"
    oanda      : "XAU_USD"
    fxcm       : "XAU/USD"
  EURUSD:
    exness     : "EURUSDm"
    icmarkets  : "EURUSD"
    pepperstone: "EURUSD"
    oanda      : "EUR_USD"
    fxcm       : "EUR/USD"
  GBPUSD:
    exness     : "GBPUSDm"
    icmarkets  : "GBPUSD"
    pepperstone: "GBPUSD"
    oanda      : "GBP_USD"
    fxcm       : "GBP/USD"