# ============================================================
# TRADING BOT — LOGGING CONFIG
# โหลดด้วย: logging.config.dictConfig(yaml.safe_load(f))
# ============================================================

version: 1
disable_existing_loggers: false   # ไม่ปิด logger ของ library อื่น


# ── 1. FORMATTERS — รูปแบบข้อความ log ───────────────────────
formatters:

  # รูปแบบละเอียด — ใช้กับไฟล์ log
  detailed:
    format: "%(asctime)s | %(levelname)-8s | %(name)-20s | %(funcName)-25s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
    # ตัวอย่าง output:
    # 2025-05-25 14:30:15 | INFO     | bot.executor         | send_order               | ✅ BUY XAUUSD lot=0.01 price=2341.50

  # รูปแบบสั้น — ใช้กับ console (ดูได้ง่ายตอน debug)
  simple:
    format: "%(asctime)s | %(levelname)-8s | %(message)s"
    datefmt: "%H:%M:%S"
    # ตัวอย่าง output:
    # 14:30:15 | INFO     | ✅ BUY XAUUSD lot=0.01

  # รูปแบบ JSON — ใช้กับ trade log (parse ง่ายด้วย Python)
  json_formatter:
    (): bot.log_formatter.JSONFormatter
    # output เป็น JSON ทุก line — ดูตัวอย่างด้านล่าง

  # รูปแบบสำหรับ Telegram (ไม่มี timestamp ซ้ำ)
  telegram:
    format: "[%(levelname)s] %(message)s"


# ── 2. HANDLERS — ปลายทางของ log ────────────────────────────
handlers:

  # Console — แสดงบน terminal (ใช้ตอน debug / run_bot.bat)
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: simple
    stream: ext://sys.stdout

  # Main bot log — ทุกอย่างรวมกัน
  file_main:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/bot.log
    maxBytes: 10485760      # 10 MB
    backupCount: 10         # เก็บย้อนหลัง 10 ไฟล์ (bot.log.1 ... bot.log.10)
    encoding: utf-8

  # Trade log — เฉพาะ order ที่เปิด/ปิด (JSON format)
  file_trades:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json_formatter
    filename: logs/trades.log
    maxBytes: 5242880       # 5 MB
    backupCount: 30         # เก็บยาว เพราะต้องวิเคราะห์ย้อนหลัง
    encoding: utf-8

  # Error log — เฉพาะ WARNING ขึ้นไป
  file_errors:
    class: logging.handlers.RotatingFileHandler
    level: WARNING
    formatter: detailed
    filename: logs/errors.log
    maxBytes: 5242880       # 5 MB
    backupCount: 5
    encoding: utf-8

  # Daily log — แยกตามวัน (ดูย้อนหลังง่าย)
  file_daily:
    class: logging.handlers.TimedRotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/daily/bot.log
    when: midnight          # แยกไฟล์ทุกเที่ยงคืน
    interval: 1
    backupCount: 90         # เก็บ 90 วัน
    encoding: utf-8
    utc: true               # ใช้ UTC (สำคัญ — MT5 ใช้ UTC)


# ── 3. LOGGERS — กำหนดแต่ละ module ──────────────────────────
loggers:

  # Bot หลัก — loop, scheduler
  bot.main:
    level: INFO
    handlers: [console, file_main, file_daily]
    propagate: false

  # MT5 connection
  bot.mt5_client:
    level: INFO
    handlers: [console, file_main, file_errors]
    propagate: false

  # Risk manager
  bot.risk_manager:
    level: INFO
    handlers: [console, file_main, file_errors]
    propagate: false

  # Order executor — สำคัญมาก log ทุก order
  bot.executor:
    level: INFO
    handlers: [console, file_main, file_trades, file_errors]
    propagate: false

  # Metrics writer
  bot.metrics_writer:
    level: WARNING          # INFO มากเกินไป — เห็นแค่ error ก็พอ
    handlers: [file_errors]
    propagate: false

  # Notifier
  bot.notifier:
    level: WARNING
    handlers: [file_errors]
    propagate: false

  # Data collection
  data:
    level: INFO
    handlers: [console, file_main]
    propagate: false

  # Feature engineering
  features:
    level: WARNING          # ไม่ verbose — เห็นแค่ปัญหา
    handlers: [file_errors]
    propagate: false

  # Model training
  models:
    level: INFO
    handlers: [console, file_main]
    propagate: false

  # Dashboard
  dashboard:
    level: WARNING
    handlers: [file_errors]
    propagate: false

  # Library loggers — ลด noise จาก library อื่น
  urllib3:
    level: WARNING
    propagate: true
  requests:
    level: WARNING
    propagate: true
  MetaTrader5:
    level: WARNING
    propagate: true


# ── 4. ROOT LOGGER — fallback ────────────────────────────────
root:
  level: WARNING
  handlers: [file_errors]